name: FPF Contracts
on: [pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install jsonschema
      - run: python -c 'import pathlib,json,jsonschema; [jsonschema.Draft7Validator.check_schema(json.loads(p.read_text())) for p in pathlib.Path("schemas").glob("*.json")]'
